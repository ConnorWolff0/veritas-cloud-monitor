name: Veritas 24/7 monitor

on:
  schedule:
    # GitHub Actions' shortest supported schedule is every 5 minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veritas-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      # Optional real SMS via Twilio:
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
      TWILIO_TO: ${{ secrets.TWILIO_TO }}

      MAX_PAGES: "5000"
      SETTLE_MS: "2000"
      STRICT_HEADERS: "0"

    steps:
      - name: Check out monitor state
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install monitor dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run monitor
        run: python monitor.py

      - name: Save new baseline/state
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name "veritas-monitor[bot]"
            git config user.email "veritas-monitor@users.noreply.github.com"
            git add state/
            git commit -m "Update Veritas monitor state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
